[workspace]
members = ["crates/xfrm-linux", "crates/vpn-auth", "crates/ikev2-wire", "crates/vpn-config", "crates/vpn-observability", "bins/ikev2d", "crates/ikev2-crypto", "crates/ikev2-core", "crates/ikev2-transport"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.1.0"

[workspace.dependencies]
xfrm-linux = { path = "crates/xfrm-linux" }
vpn-auth = { path = "crates/vpn-auth" }
ikev2-crypto = { path = "crates/ikev2-crypto" }
ikev2-core = { path = "crates/ikev2-core" }
ikev2-transport = { path = "crates/ikev2-transport" }
openssl = "0.10"
zeroize = "1"
ikev2-wire = { path = "crates/ikev2-wire" }
vpn-config = { path = "crates/vpn-config" }
vpn-observability = { path = "crates/vpn-observability" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
